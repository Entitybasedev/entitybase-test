---
# EntityBase Test Infrastructure Playbook
#
# Tag mapping:
#   common        - Base packages and kernel tuning (all hosts; tagged 'always',
#                   so it runs on every invocation, including --tags <x>)
#   mariadb       - MariaDB setup with block storage (mariadb host)
#   entitybase    - EntityBase backend installation (backend hosts)
#   import        - EntityBase import host setup (import host)
#   wikidata      - Download + import Wikidata lexemes (import host)
#   download-lexemes - Download lexeme dump only (import host)
#   import-lexemes   - Import lexemes only (import host)
#   items         - Download + import Wikidata items (import host)
#   download-items    - Download items dump only (import host)
#   import-items      - Import items only (import host)
#   dashboard     - Import progress dashboard (import host)
#   dbadmin       - Adminer web DB UI on :8081, basic auth (import host)
#   observability - Prometheus/Loki/Grafana + exporters (all hosts)
#   teardown-prep - Graceful MariaDB shutdown before teardown (tagged 'never',
#                   so it only runs when explicitly selected via --tags)

- name: EntityBase Test Infrastructure
  hosts: all
  become: true
  roles:
    - role: common
      tags: [common, always]

- name: MariaDB Setup
  hosts: mariadb
  become: true
  roles:
    - role: entitybase
      tags: [mariadb]

- name: EntityBase Backends
  hosts: backend
  become: true
  roles:
    - role: entitybase
      tags: [entitybase]

- name: Import Host Setup
  hosts: import
  become: true
  roles:
    - role: entitybase
      tags: [import]

- name: Wikidata
  hosts: import
  become: true
  roles:
    - role: wikidata
      tags: [wikidata, download-lexemes, import-lexemes, items, download-items, import-items]

- name: Dashboard
  hosts: import
  become: true
  roles:
    - role: dashboard
      tags: [dashboard]

- name: Adminer DB UI
  hosts: import
  become: true
  roles:
    - role: dbadmin
      tags: [dbadmin]

- name: Observability
  hosts: all
  become: true
  roles:
    - role: observability
      tags: [observability]

- name: Graceful MariaDB shutdown
  hosts: mariadb
  become: true
  ignore_unreachable: true
  vars:
    mariadb_running: >-
      ansible_facts.services is defined and
      ansible_facts.services['mariadb.service'] is defined and
      ansible_facts.services['mariadb.service'].state == 'running'
  tasks:
    - name: Gather service facts
      service_facts:
      failed_when: false

    - name: Flush InnoDB dirty pages for a clean shutdown
      command: mysql -e "SET GLOBAL innodb_fast_shutdown=0;"
      when: mariadb_running
      failed_when: false

    - name: Stop MariaDB (waits until fully down)
      command: mysqladmin shutdown
      when: mariadb_running
      failed_when: false

    - name: Reconcile systemd unit state
      systemd:
        name: mariadb
        state: stopped
      failed_when: false

    - name: Verify MariaDB is down
      command: systemctl is-active mariadb
      register: mariadb_state
      changed_when: false
      failed_when: false

    - name: Report MariaDB state
      debug:
        msg: "MariaDB is {{ mariadb_state.stdout | default('unreachable/absent') }}; teardown continues"
  tags: [teardown-prep, never]
