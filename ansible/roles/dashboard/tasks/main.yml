---
# Dashboard role - starts the import progress dashboard
- name: Clone entitybase-import repository
  git:
    repo: "{{ entitybase_import_repo | default('https://github.com/dpriskorn/entitybase-import.git') }}"
    dest: /opt/entitybase-import
    version: "{{ entitybase_import_branch | default('main') }}"
    force: yes

- name: Install poetry
  shell: curl -sSL https://install.python-poetry.org | python3 -
  args:
    creates: /root/.local/bin/poetry

- name: Symlink poetry onto PATH
  file:
    src: /root/.local/bin/poetry
    dest: /usr/local/bin/poetry
    state: link
    force: yes

- name: Install entitybase-import dependencies
  command: /usr/local/bin/poetry install --no-root
  args:
    chdir: /opt/entitybase-import

- name: Create dashboard systemd service
  template:
    src: dashboard.service.j2
    dest: /etc/systemd/system/entitybase-dashboard.service
    mode: "0644"
  notify:
    - dashboard daemon reload
    - restart dashboard

- name: Enable and start dashboard service
  systemd:
    name: entitybase-dashboard
    state: started
    enabled: yes
    daemon_reload: yes
