---
# Observability defaults
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
# Grafana 13 silently ignores classic file-based dashboard provisioning;
# pin to 12.x until dashboards are migrated to the v2 provisioning format
grafana_version: "12.*"
mysqld_exporter_password: "metrics-ro"

# Loki endpoint (private IP of import host, set in inventory all:vars)
loki_host: "{{ entitybase_loki_host | default(groups['import'][0]) }}"

# Units whose journal logs are shipped to Loki (journal source captures all
# units; kept for documentation/reference)
alloy_journal_units:
  - entitybase
  - mariadb
  - entitybase-dashboard

# Extra log files to ship (import logs)
alloy_log_files:
  - /var/log/entitybase/*.log
