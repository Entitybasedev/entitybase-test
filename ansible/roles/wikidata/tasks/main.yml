---
# Wikidata role - downloads lexeme dump and loads into MariaDB

# Import storage provisioning
- name: Install storage utilities
  apt:
    name:
      - parted
      - e2fsprogs
      - util-linux
    state: present

- name: Wait for block storage device to appear
  wait_for:
    path: /dev/vdb
    timeout: 120

- name: Check if volume is already partitioned
  shell: lsblk -o NAME /dev/vdb | grep -c vdb1
  register: partition_check
  changed_when: false

- name: Create GPT partition table
  command: parted /dev/vdb mklabel gpt
  when: partition_check.rc != 0

- name: Create partition
  command: parted /dev/vdb mkpart primary ext4 0% 100%
  when: partition_check.rc != 0

- name: Check if volume is already formatted
  shell: blkid /dev/vdb1 | grep -c ext4
  register: format_check
  changed_when: false

- name: Format volume as ext4
  filesystem:
    fstype: ext4
    dev: /dev/vdb1
  when: format_check.rc != 0

- name: Create data directory
  file:
    path: /opt/entitybase-import/libs/entitybase-import/data
    state: directory
    mode: "0755"

- name: Mount volume to data directory
  mount:
    path: /opt/entitybase-import/libs/entitybase-import/data
    src: /dev/vdb1
    fstype: ext4
    state: mounted

# Lexemes
- name: Download Wikidata lexeme dump
  get_url:
    url: https://dumps.wikimedia.org/wikidatawiki/entities/latestlexemes.json.gz
    dest: /opt/entitybase-import/libs/entitybase-import/data/lexemes.json.gz
    timeout: 3600
  register: download_result
  retries: 3
  until: download_result is succeeded
  tags: [wikidata]

- name: Import lexemes into EntityBase
  command: >
    poetry run python -m src.cli import /opt/entitybase-import/libs/entitybase-import/data/lexemes.json.gz
    --host {{ entitybase_lb_host }}
    --port 8080
  args:
    chdir: /opt/entitybase-import/libs/entitybase-import
  register: load_result
  ignore_errors: yes
  tags: [wikidata]

- name: Print lexeme load result
  debug:
    var: load_result.stdout_lines
  when: load_result is defined
  tags: [wikidata]

# Items (~150GB compressed)
- name: Download Wikidata items dump
  get_url:
    url: https://dumps.wikimedia.org/wikidatawiki/entities/latest-all.json.gz
    dest: /opt/entitybase-import/libs/entitybase-import/data/items.json.gz
    timeout: 86400
  register: items_download_result
  retries: 3
  until: items_download_result is succeeded
  tags: [items]

- name: Import items into EntityBase
  command: >
    poetry run python -m src.cli import /opt/entitybase-import/libs/entitybase-import/data/items.json.gz
    --host {{ entitybase_lb_host }}
    --port 8080
  args:
    chdir: /opt/entitybase-import/libs/entitybase-import
  register: items_load_result
  ignore_errors: yes
  tags: [items]

- name: Print items load result
  debug:
    var: items_load_result.stdout_lines
  when: items_load_result is defined
  tags: [items]
