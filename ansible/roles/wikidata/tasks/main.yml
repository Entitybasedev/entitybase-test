---
# Wikidata role - downloads and imports Wikidata dumps

# Import storage provisioning
- name: Provision import storage
  include_role:
    name: storage
  vars:
    storage_mount_point: /opt/entitybase-import/libs/entitybase-import/data
  tags: [wikidata, download-lexemes, import-lexemes, items, download-items, import-items]

# Lexemes
- name: Download Wikidata lexeme dump
  get_url:
    url: https://dumps.wikimedia.org/wikidatawiki/entities/latest-lexemes.json.gz
    dest: /opt/entitybase-import/libs/entitybase-import/data/lexemes.json.gz
    timeout: 3600
  register: download_result
  retries: 3
  until: download_result is succeeded
  tags: [wikidata, download-lexemes]

- name: Import lexemes into EntityBase
  command: >
    poetry run python -m src.cli import /opt/entitybase-import/libs/entitybase-import/data/lexemes.json.gz
    --host {{ entitybase_lb_host }}
    --port 8080
  args:
    chdir: /opt/entitybase-import/libs/entitybase-import
  register: load_result
  tags: [wikidata, import-lexemes]

- name: Print lexeme load result
  debug:
    var: load_result.stdout_lines
  when: load_result is defined
  tags: [wikidata, import-lexemes]

# Items (~150GB compressed)
- name: Download Wikidata items dump
  get_url:
    url: https://dumps.wikimedia.org/wikidatawiki/entities/latest-all.json.gz
    dest: /opt/entitybase-import/libs/entitybase-import/data/items.json.gz
    timeout: 86400
  register: items_download_result
  retries: 3
  until: items_download_result is succeeded
  tags: [items, download-items]

- name: Import items into EntityBase
  command: >
    poetry run python -m src.cli import /opt/entitybase-import/libs/entitybase-import/data/items.json.gz
    --host {{ entitybase_lb_host }}
    --port 8080
  args:
    chdir: /opt/entitybase-import/libs/entitybase-import
  register: items_load_result
  tags: [items, import-items]

- name: Print items load result
  debug:
    var: items_load_result.stdout_lines
  when: items_load_result is defined
  tags: [items, import-items]
