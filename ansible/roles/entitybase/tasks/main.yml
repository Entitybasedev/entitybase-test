---
# MariaDB storage provisioning (only on mariadb host)
- name: Provision MariaDB storage
  include_role:
    name: storage
  vars:
    storage_mount_point: /data/mysql
  when: "'mariadb' in group_names"

- name: Install MariaDB server
  apt:
    name:
      - mariadb-server
      - mariadb-client
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: "'mariadb' in group_names"

- name: Stop MariaDB before moving data
  systemd:
    name: mariadb
    state: stopped
  when: "'mariadb' in group_names"
  ignore_errors: yes

- name: Move existing MariaDB data to new volume
  shell: |
    if [ -d /var/lib/mysql ] && [ "$(ls -A /var/lib/mysql 2>/dev/null)" ]; then
      cp -a /var/lib/mysql/* /data/mysql/
      rm -rf /var/lib/mysql/*
    fi
  when: "'mariadb' in group_names"

- name: Deploy MariaDB tuning config
  template:
    src: mariadb.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-entitybase.cnf
    mode: "0644"
  when: "'mariadb' in group_names"
  notify: restart mariadb

- name: Initialize MariaDB data directory if empty
  shell: mariadb-install-db --datadir=/data/mysql --user=mysql
  args:
    creates: /data/mysql/mysql/ibdata1
  when: "'mariadb' in group_names"

- name: Enable and start MariaDB
  systemd:
    name: mariadb
    state: started
    enabled: yes
  when: "'mariadb' in group_names"

- name: Create entitybase database and user
  shell: |
    mariadb <<'EOF'
    CREATE DATABASE IF NOT EXISTS entitybase;
    CREATE USER IF NOT EXISTS 'entitybase'@'10.0.0.%' IDENTIFIED BY '{{ entitybase_db_password }}';
    GRANT ALL PRIVILEGES ON entitybase.* TO 'entitybase'@'10.0.0.%';
    FLUSH PRIVILEGES;
    EOF
  changed_when: true
  when: "'mariadb' in group_names"

# EntityBase API backend - dpriskorn/entitybase-backend, run with poetry+uvicorn
# (requires Python >= 3.13)

- name: Add deadsnakes PPA
  apt_repository:
    repo: ppa:deadsnakes/ppa
    state: present
    update_cache: yes
  when: "'backend' in group_names"

- name: Install Python 3.13
  apt:
    name:
      - python3.13
      - python3.13-venv
    state: present
  when: "'backend' in group_names"

- name: Install poetry
  shell: curl -sSL https://install.python-poetry.org | POETRY_HOME=/opt/poetry python3 -
  args:
    creates: /opt/poetry/bin/poetry
  when: "'backend' in group_names"

- name: Symlink poetry onto PATH
  file:
    src: /opt/poetry/bin/poetry
    dest: /usr/local/bin/poetry
    state: link
    force: yes
  when: "'backend' in group_names"

- name: Clone EntityBase backend repository
  git:
    repo: "{{ entitybase_backend_repo }}"
    dest: /opt/entitybase-backend
    version: "{{ entitybase_backend_branch }}"
    force: yes
  when: "'backend' in group_names"

- name: Install EntityBase backend dependencies
  shell: /usr/local/bin/poetry env use /usr/bin/python3.13 && /usr/local/bin/poetry install
  args:
    chdir: /opt/entitybase-backend
  environment:
    POETRY_VIRTUALENVS_IN_PROJECT: "true"
  when: "'backend' in group_names"

- name: Create data directory
  file:
    path: /opt/entitybase-backend/data
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  when: "'backend' in group_names"

# EntityBase backend service - only on backend hosts
- name: Deploy entitybase env config
  template:
    src: entitybase.env.j2
    dest: /opt/entitybase-backend/.env
    mode: "0600"
  when: "'backend' in group_names"
  notify: restart entitybase

- name: Create systemd service for entitybase
  template:
    src: entitybase.service.j2
    dest: /etc/systemd/system/entitybase.service
    mode: "0644"
  when: "'backend' in group_names"
  notify:
    - entitybase daemon reload
    - restart entitybase

- name: Initialize backend database schema
  command: /usr/local/bin/poetry run python -m models.workers.dev tables setup
  args:
    chdir: /opt/entitybase-backend
  environment:
    DB_TYPE: mysql
    DB_HOST: "{{ entitybase_mariadb_host }}"
    DB_PORT: "3306"
    DB_DATABASE: entitybase
    DB_USER: entitybase
    DB_PASSWORD: "{{ entitybase_db_password }}"
  run_once: true
  when: "'backend' in group_names"

- name: Enable and start entitybase service
  systemd:
    name: entitybase
    state: started
    enabled: yes
    daemon_reload: yes
  when: "'backend' in group_names"
