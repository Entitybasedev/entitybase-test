---
# MariaDB storage provisioning (only on mariadb host)
- name: Install storage utilities
  apt:
    name:
      - parted
      - e2fsprogs
      - util-linux
    state: present
  when: "'mariadb' in group_names"

- name: Wait for block storage device to appear
  wait_for:
    path: /dev/vdb
    timeout: 120
  when: "'mariadb' in group_names"

- name: Check if volume is already partitioned
  shell: lsblk -o NAME /dev/vdb | grep -c vdb1
  register: partition_check
  changed_when: false
  when: "'mariadb' in group_names"

- name: Create GPT partition table
  command: parted /dev/vdb mklabel gpt
  when: "'mariadb' in group_names" and partition_check.rc != 0

- name: Create partition
  command: parted /dev/vdb mkpart primary ext4 0% 100%
  when: "'mariadb' in group_names" and partition_check.rc != 0

- name: Check if volume is already formatted
  shell: blkid /dev/vdb1 | grep -c ext4
  register: format_check
  changed_when: false
  when: "'mariadb' in group_names"

- name: Format volume as ext4
  filesystem:
    fstype: ext4
    dev: /dev/vdb1
  when: "'mariadb' in group_names" and format_check.rc != 0

- name: Create mount point
  file:
    path: /data/mysql
    state: directory
    mode: "0755"
  when: "'mariadb' in group_names"

- name: Mount volume
  mount:
    path: /data/mysql
    src: /dev/vdb1
    fstype: ext4
    state: mounted
  when: "'mariadb' in group_names"

- name: Stop MariaDB before moving data
  systemd:
    name: mariadb
    state: stopped
  when: "'mariadb' in group_names"
  ignore_errors: yes

- name: Move existing MariaDB data to new volume
  shell: |
    if [ -d /var/lib/mysql ] && [ "$(ls -A /var/lib/mysql 2>/dev/null)" ]; then
      cp -a /var/lib/mysql/* /data/mysql/
      rm -rf /var/lib/mysql/*
    fi
  when: "'mariadb' in group_names"

# EntityBase backend role - installs from source with poetry
- name: Clone EntityBase repository
  git:
    repo: "{{ entitybase_repo }}"
    dest: /opt/entitybase
    version: "{{ entitybase_branch }}"
    force: yes

- name: Install poetry
  pip:
    name: poetry
    executable: pip3

- name: Install EntityBase dependencies
  command: poetry install --no-root
  args:
    chdir: /opt/entitybase

- name: Deploy entitybase env config
  template:
    src: entitybase.env.j2
    dest: /opt/entitybase/.env
    mode: "0600"
  notify: restart entitybase

- name: Create systemd service for entitybase
  template:
    src: entitybase.service.j2
    dest: /etc/systemd/system/entitybase.service
    mode: "0644"
  notify:
    - daemon reload
    - restart entitybase

- name: Enable and start entitybase service
  systemd:
    name: entitybase
    state: started
    enabled: yes
    daemon_reload: yes
