---
# MariaDB storage provisioning (only on mariadb host)
- name: Provision MariaDB storage
  include_role:
    name: storage
  vars:
    storage_mount_point: /data/mysql
  when: "'mariadb' in group_names"

- name: Install MariaDB server
  apt:
    name:
      - mariadb-server
      - mariadb-client
    state: present
    update_cache: yes
  when: "'mariadb' in group_names"

- name: Stop MariaDB before moving data
  systemd:
    name: mariadb
    state: stopped
  when: "'mariadb' in group_names"
  ignore_errors: yes

- name: Move existing MariaDB data to new volume
  shell: |
    if [ -d /var/lib/mysql ] && [ "$(ls -A /var/lib/mysql 2>/dev/null)" ]; then
      cp -a /var/lib/mysql/* /data/mysql/
      rm -rf /var/lib/mysql/*
    fi
  when: "'mariadb' in group_names"

- name: Deploy MariaDB tuning config
  template:
    src: mariadb.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-entitybase.cnf
    mode: "0644"
  when: "'mariadb' in group_names"
  notify: restart mariadb

- name: Initialize MariaDB data directory if empty
  shell: mariadb-install-db --datadir=/data/mysql --user=mysql
  args:
    creates: /data/mysql/mysql/ibdata1
  when: "'mariadb' in group_names"

- name: Enable and start MariaDB
  systemd:
    name: mariadb
    state: started
    enabled: yes
  when: "'mariadb' in group_names"

# EntityBase backend role - installs from source with poetry
- name: Clone EntityBase repository
  git:
    repo: "{{ entitybase_repo }}"
    dest: /opt/entitybase
    version: "{{ entitybase_branch }}"
    force: yes

- name: Install poetry
  shell: curl -sSL https://install.python-poetry.org | python3 -
  args:
    creates: /root/.local/bin/poetry

- name: Symlink poetry onto PATH
  file:
    src: /root/.local/bin/poetry
    dest: /usr/local/bin/poetry
    state: link
    force: yes

- name: Install EntityBase dependencies
  command: /usr/local/bin/poetry install --no-root
  args:
    chdir: /opt/entitybase

# EntityBase backend service - only on backend hosts
- name: Deploy entitybase env config
  template:
    src: entitybase.env.j2
    dest: /opt/entitybase/.env
    mode: "0600"
  when: "'backend' in group_names"
  notify: restart entitybase

- name: Create systemd service for entitybase
  template:
    src: entitybase.service.j2
    dest: /etc/systemd/system/entitybase.service
    mode: "0644"
  when: "'backend' in group_names"
  notify:
    - entitybase daemon reload
    - restart entitybase

- name: Enable and start entitybase service
  systemd:
    name: entitybase
    state: started
    enabled: yes
    daemon_reload: yes
  when: "'backend' in group_names"
